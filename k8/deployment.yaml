apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartmate-agentic-assistant
  labels:
    app: cartmate-agentic-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cartmate-agentic-assistant
  template:
    metadata:
      labels:
        app: cartmate-agentic-assistant
    spec:
      containers:
      - name: cartmate-agentic-assistant
        image: 459497895986.dkr.ecr.us-west-1.amazonaws.com/cartmate-agentic-assistant:latest
        ports:
        - containerPort: 8000
        env:                              
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: cartmate-agentic-assistant-secrets
              key: GROQ_API_KEY
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: cartmate-agentic-assistant-secrets
              key: GOOGLE_API_KEY
        - name: ASTRA_DB_API_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: cartmate-agentic-assistant-secrets
              key: ASTRA_DB_API_ENDPOINT
        - name: ASTRA_DB_APPLICATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: cartmate-agentic-assistant-secrets
              key: ASTRA_DB_APPLICATION_TOKEN
        - name: ASTRA_DB_KEYSPACE
          valueFrom:
            secretKeyRef:
              name: cartmate-agentic-assistant-secrets
              key: ASTRA_DB_KEYSPACE